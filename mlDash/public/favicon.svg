<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Using standard filled rectangles instead of strokes for 100% browser compatibility -->
  <rect x="20" y="15" width="60" height="18" rx="9" fill="url(#mainGrad)" />
  <rect x="20" y="41" width="35" height="18" rx="9" fill="url(#mainGrad)" />
  <rect x="20" y="67" width="60" height="18" rx="9" fill="url(#mainGrad)" />
  <rect x="20" y="15" width="18" height="70" rx="9" fill="url(#mainGrad)" />

  <!-- Accent Node -->
  <circle cx="80" cy="50" r="10" fill="url(#accentGrad)" />
</svg>